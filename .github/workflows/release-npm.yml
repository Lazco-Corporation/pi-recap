# Tag-driven npm release.
#
# Tag grammar: v<version>   e.g. v0.2.0, v1.0.0-beta.1
#
# The tag is created by `scripts/release.sh`, which runs `npm version`. That
# command writes package.json, commits, and tags in one step, so the tag and
# package.json always agree. This workflow re-checks that agreement anyway:
# npm-publish fails when `expected-version` and package.json disagree.
#
# A prerelease version (v1.0.0-beta.1) goes to the `next` dist-tag, never
# `latest`. npm-publish also refuses `latest` for a prerelease on its own.
#
# The GitHub release notes are the CHANGELOG.md section for the version, read
# by `scripts/changelog-notes.sh`, followed by the notes that GitHub generates.
#
# ── SHARED ACTIONS (ci-actions) ────────────────────────────────────────────
# infisical-fetch and npm-publish come from Lazco-Corporation/ci-actions@v1.
# Log and output format is defined there.
#
# ── CONFIG SOURCED FROM INFISICAL ──────────────────────────────────────────
#   Project: lazco-pi-recap   Path: /ci   Env-slug: prod
#   NPM_TOKEN   npm automation token with publish rights on @lazco
#
# The only GitHub-native config is the OIDC bootstrap:
#   vars.INFISICAL_CI_IDENTITY_ID   Infisical machine-identity id
#
# This package ships TypeScript source (see `files` in package.json), so there
# is no build step. `npm run check` and `npm run test` are the gate.
#
# The job runs on a GitHub-hosted runner on purpose. Blacksmith is for heavy
# CPU or a warm disk cache, which an npm publish does not need.

name: Release (npm)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # the last step creates the GitHub release
      id-token: write # npm provenance + Infisical OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Read the notes before the publish, so a missing CHANGELOG.md entry stops the release early.
      - name: Read the release notes from CHANGELOG.md
        run: scripts/changelog-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

      - uses: Lazco-Corporation/ci-actions/infisical-fetch@v1
        with:
          project-slug: lazco-pi-recap
          env-slug: prod
          identity-id: ${{ vars.INFISICAL_CI_IDENTITY_ID }}
          required-keys: NPM_TOKEN

      - id: publish
        uses: Lazco-Corporation/ci-actions/npm-publish@v1
        with:
          token: ${{ env.NPM_TOKEN }}
          expected-version: ${{ github.ref_name }}
          dist-tag: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
          package-manager: npm

      - name: Create the GitHub release
        if: steps.publish.outputs.result == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          args=(--notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
